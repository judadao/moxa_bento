[preset.0]
name="Linux"
platform="Linux"
runnable=true
export_filter="all_resources"
include_filter="assets/atelier/metrics.json"
exclude_filter="companion/*,tests/*,docs/*,output/*,.venv/*,scripts/*.py,*.md,*.bat,*.sh,*.py,requirements.txt"
export_path="build/linux/bin/bento-buddy"

[preset.0.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

[preset.1]
name="Windows"
platform="Windows Desktop"
runnable=true
export_filter="all_resources"
include_filter="assets/atelier/metrics.json"
exclude_filter="companion/*,tests/*,docs/*,output/*,.venv/*,scripts/*.py,*.md,*.bat,*.sh,*.py,requirements.txt"
export_path="build/windows/bin/bento-buddy.exe"

[preset.1.options]
binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
